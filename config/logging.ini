; Logging configuration for gunicorn + the Flask app (api/wsgi.py).
; NOTE: never log request headers or bodies at INFO — they contain
; Authorization headers and payment metadata. See docs/adr/0002.

[loggers]
keys=root,harborline,gunicorn.error,gunicorn.access,sqlalchemy

[handlers]
keys=console

[formatters]
keys=json

[logger_root]
level=WARNING
handlers=console

[logger_harborline]
level=INFO
handlers=console
qualname=harborline
propagate=0

[logger_gunicorn.error]
level=INFO
handlers=console
qualname=gunicorn.error
propagate=0

[logger_gunicorn.access]
level=INFO
handlers=console
qualname=gunicorn.access
propagate=0

[logger_sqlalchemy]
level=WARNING
handlers=console
qualname=sqlalchemy.engine
propagate=0

[handler_console]
class=StreamHandler
formatter=json
args=(sys.stdout,)

[formatter_json]
format={"ts": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "msg": "%(message)s"}
datefmt=%Y-%m-%dT%H:%M:%S%z
