# Secret scanning for every push and PR.
# Added by Lena Vogel (security) — Aug 2025. Questions: #security.
#
# Exit codes from `gitleaks git`:
#   0   no leaks found
#   1   leaks found (the value of --exit-code, default 1)
#   126 unknown flag / bad invocation
#   anything else: gitleaks itself failed (bad config, git error, ...)
# We let the SARIF upload run on exit 1 so findings show up in the Security tab,
# then fail the job at the end.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly full-history scan, Monday 06:17 UTC

permissions:
  contents: read
  security-events: write

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # shallow clones hide history — gitleaks needs every commit

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        id: scan
        run: |
          set +e
          gitleaks git --no-banner --redact \
            --report-format sarif --report-path gitleaks.sarif .
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::gitleaks failed to run (exit $rc)"
            exit "$rc"
          fi
          exit 0

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Fail if leaks were found
        if: steps.scan.outputs.exit_code == '1'
        run: |
          echo "::error::gitleaks found potential secrets — see the Security tab / SARIF report."
          exit 1
