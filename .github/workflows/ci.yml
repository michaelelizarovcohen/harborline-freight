name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hbl
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: harborline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hbl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        env:
          HBL_ENV: test
          DB_HOST: localhost
          DB_USER: hbl
          DB_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          DB_NAME: harborline_test
        run: pytest -q --maxfail=5

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - name: Build
        env:
          VITE_API_BASE_URL: https://staging.harborline.example/api
          VITE_MAPS_API_KEY: ${{ secrets.VITE_MAPS_API_KEY_STAGING }}
        run: npm run build
