apiVersion: apps/v1
kind: Deployment
metadata:
  name: harborline-api
  labels:
    app.kubernetes.io/name: harborline-api
    app.kubernetes.io/part-of: harborline
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: harborline-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harborline-api
        app.kubernetes.io/part-of: harborline
    spec:
      serviceAccountName: harborline-api
      containers:
        - name: api
          image: harborline/api:latest # overridden by overlays / deploy.sh
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: harborline-config
            - secretRef:
                name: harborline-api
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
