apiVersion: apps/v1
kind: Deployment
metadata:
  name: harborline-api
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: api
          env:
            - name: HBL_ENV
              value: production
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
# TODO(tomas): add HPA once we have a month of peak-season metrics.
