# Served by the harborline/web container (nginx:1.27-alpine, non-root, port 8080).
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","status":$status,'
                              '"method":"$request_method","path":"$uri",'
                              '"bytes":$body_bytes_sent,"ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root   /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed Vite assets can be cached forever.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Never serve source maps or dotfiles in production builds.
    location ~ \.map$ { return 404; }
    location ~ /\.    { deny all; }

    # SPA fallback
    location / {
      try_files $uri /index.html;
    }
  }
}
